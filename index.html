<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paris 2026</title>

<style>
body {
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background:#fafafa;
    color:#111;
}

header {
    padding:60px 25px 30px;
}

h1 {
    font-size:48px;
    font-weight:600;
    letter-spacing:-2px;
    margin:0;
}

.subtitle {
    color:#777;
    margin-top:10px;
    font-size:18px;
}

.grid {
    padding:25px;
    display:grid;
    gap:15px;
}

.card {
    background:white;
    border-radius:22px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
    font-size:20px;
}

.card span {
    font-size:30px;
}

</style>

</head>

<body>

<header>

<h1>Paris 2026</h1>

<div class="subtitle">
8 — 14 August · Personal travel companion
</div>

</header>


<div class="grid">

<div class="card">
<span>🗓</span><br>
Itinerary
</div>

<div class="card">
<span>🍽</span><br>
Food
</div>

<div class="card">
<span>🪑</span><br>
Vintage & Design
</div>

<div class="card">
<span>🏛</span><br>
Architecture
</div>

<div class="card">
<span>🏃</span><br>
Running
</div>

<div class="card">
<span>👦</span><br>
Leo
</div>

</div>


</body>
</html>
